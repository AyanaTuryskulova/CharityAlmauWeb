{% extends 'base.html' %}
{% load i18n %}

{% block navbar %}{% endblock %}
{% block title %}{% trans "Доступ запрещён" %}{% endblock %}

{% block extra_css %}
<style>
    body {
        min-height: 100vh;
        background: #f0f4f8;
    }
    .error-card {
        max-width: 520px;
        margin: 60px auto;
        background: #ffffff;
        border-radius: 20px;
        border: 1px solid #e6edf6;
        padding: 40px 32px;
        text-align: center;
        box-shadow: 0 1px 3px rgba(26, 64, 104, 0.08);
    }
    .error-card h1 {
        color: #312e81;
        font-size: 26px;
        margin: 0 0 16px;
    }
    .error-card p {
        color: #475569;
        font-size: 17px;
        line-height: 1.5;
        margin: 0 0 24px;
    }
    .error-card a {
        display: inline-block;
        background: #4f46e5;
        color: #fff;
        text-decoration: none;
        padding: 12px 32px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 15px;
    }
    .error-card a:hover { opacity: 0.9; }
</style>
{% endblock %}

{% block content %}
<div class="error-card">
    <h1>{% trans "Доступ запрещён" %}</h1>
    <p>{{ error_message }}</p>
    <a href="{% url 'login' %}">{% trans "Вернуться к входу" %}</a>
</div>
{% endblock %}

{% extends 'base.html' %}
{% load i18n %}

{% block navbar %}{% endblock %}
{% block title %}{% trans "Доступ запрещён" %}{% endblock %}

{% block extra_css %}
<style>
    body {
        min-height: 100vh;
        background: linear-gradient(175deg, #d7e6ff, #c5d8fb);
    }
    .error-card {
        max-width: 520px;
        margin: 60px auto;
        background: rgba(255,255,255,0.9);
        border-radius: 22px;
        padding: 40px 32px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(73,106,170,0.2);
    }
    .error-card h1 {
        color: #e67e22;
        font-size: 26px;
        margin: 0 0 16px;
    }
    .error-card p {
        color: #506da0;
        font-size: 17px;
        line-height: 1.5;
        margin: 0 0 24px;
    }
    .error-card a {
        display: inline-block;
        background: linear-gradient(180deg, #2f78f5, #1959ce);
        color: #fff;
        text-decoration: none;
        padding: 12px 32px;
        border-radius: 10px;
        font-weight: 600;
        font-size: 16px;
    }
    .error-card a:hover { opacity: 0.9; }
</style>
{% endblock %}

{% block content %}
<div class="error-card">
    <h1>{% trans "Доступ запрещён" %}</h1>
    <p>{{ error_message }}</p>
    <a href="{% url 'login' %}">{% trans "Вернуться к входу" %}</a>
</div>
{% endblock %}

{% load i18n %}
{% get_current_language as CURRENT_LANG %}
<div style="display:inline-flex;align-items:center;gap:5px;margin-left:auto;flex-shrink:0;">
    {% for code, name in LANGUAGES %}
    <a href="{% url 'switch_language' code %}?next={{ request.get_full_path }}"
       title="{{ name }}"
       style="display:inline-block;
              padding:4px 12px;
              border-radius:20px;
              border:1px solid #cbd5e1;
              font-size:12px;
              font-weight:700;
              letter-spacing:.5px;
              text-decoration:none;
              transition:background .15s,color .15s,border-color .15s;
              {% if code == CURRENT_LANG %}
                  background:#1d4ed8;color:#ffffff;border-color:#1d4ed8;
              {% else %}
                  background:#ffffff;color:#64748b;border-color:#cbd5e1;
              {% endif %}
       ">{{ code|upper }}</a>
    {% endfor %}
</div>

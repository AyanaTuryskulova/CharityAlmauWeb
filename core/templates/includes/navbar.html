{% load static i18n %}
<header class="uni-topbar">
    <nav class="uni-topbar__nav">
        <a href="{% url 'home' %}" class="uni-brand" aria-label="{% trans 'Главная' %}">
            <img src="{% static 'logohorizontal 1.png' %}" alt="Charity AlmaU">
        </a>

        <button type="button" class="uni-burger" id="navBurger" aria-label="{% trans 'Меню' %}" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>

        <div class="uni-topbar__links" id="navLinks">
            <a href="{% url 'home' %}" class="uni-topbar__link{% if active_page == 'home' %} uni-topbar__link--active{% endif %}">{% trans "Каталог" %}</a>
            <a href="{% url 'requests' %}" class="uni-topbar__link{% if active_page == 'requests' %} uni-topbar__link--active{% endif %}">{% trans "Заявки" %}</a>
            <a href="{% url 'chat_list' %}" class="uni-topbar__link{% if active_page == 'chats' %} uni-topbar__link--active{% endif %}">{% trans "Чаты" %}</a>
            <form method="get" action="{% url 'home' %}" class="uni-topbar__search">
                <input type="search" name="q" value="{{ request.GET.q }}" placeholder="{% trans 'Поиск вещей...' %}" class="uni-topbar__search-input">
            </form>
            <a href="{% url 'add_product' %}" class="uni-topbar__add{% if active_page == 'add' %} uni-topbar__add--active{% endif %}">{% trans "Добавить" %}</a>
            <div class="uni-topbar__right">
                {% if user.is_authenticated %}
                    <a href="{% url 'my_ads' %}" class="uni-topbar__profile{% if active_page == 'profile' %} uni-topbar__profile--active{% endif %}">
                        <span aria-hidden="true">◉</span> {% trans "Профиль" %}
                    </a>
                    <form method="post" action="{% url 'logout' %}" style="display:flex;align-items:center;">
                        {% csrf_token %}
                        <button type="submit" class="uni-topbar__logout-btn">
                            {% trans "Выйти" %}
                        </button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="uni-topbar__profile">
                        <span aria-hidden="true">◉</span> {% trans "Профиль" %}
                    </a>
                {% endif %}
            </div>
        </div>
    </nav>
</header>
<script>
(function(){
    var btn=document.getElementById('navBurger'),
        nav=document.getElementById('navLinks');
    if(!btn||!nav) return;
    btn.addEventListener('click',function(){
        var open=nav.classList.toggle('is-open');
        btn.classList.toggle('is-open',open);
        btn.setAttribute('aria-expanded',open);
    });
})();
</script>
